name: CI

on:
  push:
    branches: [main, main-next]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WOS_MOCK_MODE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app_user:app_dev_pw@127.0.0.1:5432/wos_test
      DATABASE_URL_OWNER: postgres://wos_owner:owner_dev_pw@127.0.0.1:5432/wos_test
      DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/wos_test
      TEST_DATABASE_URL: postgres://app_user:app_dev_pw@127.0.0.1:5432/wos_test
      TEST_DATABASE_URL_OWNER: postgres://wos_owner:owner_dev_pw@127.0.0.1:5432/wos_test
      TEST_DATABASE_URL_ADMIN: postgres://postgres:postgres@127.0.0.1:5432/wos_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner ships PostgreSQL 18 client tools. pg_dump 17+ emits
      # `SET transaction_timeout`, which the postgres:16 service rejects on restore
      # (backup-script tests). Use client tools of the same major version as the server.
      - name: Install PostgreSQL 16 client tools and put them first on PATH
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Confirm client/server major versions match
        run: |
          pg_dump --version
          psql -h 127.0.0.1 -U postgres -tAc "show server_version"
        env:
          PGPASSWORD: postgres
      - name: Create roles and databases (wos_dev, wos_test, wos_e2e)
        run: psql -h 127.0.0.1 -U postgres -f scripts/setup-local-db.sql
        env:
          PGPASSWORD: postgres
      - run: pnpm test
      - run: pnpm test:isolation
      - name: Event bus in audit-trail fallback mode
        run: WOS_DURABLE_EVENTS=0 npx vitest run packages/core/test/kimi.test.ts packages/core/test/producer-replay.test.ts packages/core/test/verify-fixes.test.ts packages/core/test/storm-sync.test.ts

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://app_user:app_dev_pw@127.0.0.1:5432/wos_e2e
      E2E_OWNER_DATABASE_URL: postgres://wos_owner:owner_dev_pw@127.0.0.1:5432/wos_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create roles and databases (incl. wos_e2e)
        run: psql -h 127.0.0.1 -U postgres -f scripts/setup-local-db.sql
        env:
          PGPASSWORD: postgres
      # Playwright's webServer runs `next start`, which needs a production build.
      - name: Build apps/web for e2e
        run: pnpm build
      - run: pnpm test:e2e
