# Local development database only. Not for production (Render runs its own).
#   docker compose up -d
# First start creates the wos_owner/app_user roles and the wos_dev, wos_test
# and wos_e2e databases from scripts/setup-local-db.sql. That script only runs
# on an empty volume; to start over: docker compose down -v
services:
  db:
    image: postgres:16-alpine
    container_name: scout-os-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432" # this machine only, not your network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg_dev_pw # local dev only; matches DATABASE_URL_ADMIN in .env.example
      # No POSTGRES_DB on purpose: the setup script creates the databases owned by wos_owner.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/setup-local-db.sql:/docker-entrypoint-initdb.d/01-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
