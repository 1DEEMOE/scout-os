# Scout OS on Render.
# Does not run database migrations. Apply packages/db/migrations (0013–0019)
# by hand only after Darian reviews the SQL.
# No secret values are stored here.
#
# Database roles (least privilege, CLAUDE.md law 5): the app must NOT connect
# as Render's default database user, which owns the database and could turn
# row-level security off. Before the first deploy, run
# scripts/render-db-roles.sql once as the default user, migrate as wos_owner,
# then set DATABASE_URL on both services to the app_user connection string.
# See docs/plans/live-integration-runbook.md ("Render database roles").

previews:
  generation: "off"

databases:
  - name: scout-os-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    region: oregon
    databaseName: scout_os
    diskSizeGB: 1

envVarGroups:
  - name: scout-os-shared
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WOS_MOCK_MODE
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: MODEL_PRICE_INPUT_USD_PER_MTOK
        value: "3"
      - key: MODEL_PRICE_OUTPUT_USD_PER_MTOK
        value: "15"
      - key: WOS_INBOX_SYNC_SECONDS
        value: "300"
      # Proxies in front of the app (Render's load balancer). Use 2 if Cloudflare is added.
      - key: WOS_TRUSTED_PROXY_HOPS
        value: "1"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: WOS_SECRETS_KEY
        generateValue: true

services:
  - type: web
    name: scout-os-web
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: "off"
    healthCheckPath: /api/healthz
    buildCommand: corepack enable && corepack prepare pnpm@10.28.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @wos/web build
    startCommand: pnpm --filter @wos/web start
    envVars:
      - fromGroup: scout-os-shared
      # app_user connection string (NOT the database's default connectionString).
      - key: DATABASE_URL
        sync: false
      # No DATABASE_URL_ADMIN here: public booking links use a narrow RLS
      # policy (migration 0019), so the web process holds no cross-tenant credential.
      - key: BETTER_AUTH_URL
        fromService:
          name: scout-os-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Platform email (resets, invites). Unset = MOCK sender; screens say nothing was sent.
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: worker
    name: scout-os-worker
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: corepack enable && corepack prepare pnpm@10.28.0 --activate && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @wos/web worker
    envVars:
      - fromGroup: scout-os-shared
      # app_user connection string, as for the web service.
      - key: DATABASE_URL
        sync: false
      # Optional: a BYPASSRLS role for the lost-routine-run reconciler only.
      # Leave unset if the host can't grant BYPASSRLS; routines still run,
      # only recovery of runs lost to a crash is skipped (logged at startup).
      - key: DATABASE_URL_ADMIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
