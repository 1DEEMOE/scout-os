# Scout OS on Render.
# Does not run database migrations. Apply packages/db/migrations (0013–0018)
# by hand only after Darian reviews the SQL.
# No secret values are stored here.

previews:
  generation: "off"

databases:
  - name: scout-os-db
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    region: oregon
    databaseName: scout_os
    diskSizeGB: 1

envVarGroups:
  - name: scout-os-shared
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WOS_MOCK_MODE
        value: "1"
      - key: LOG_LEVEL
        value: info
      - key: MODEL_PRICE_INPUT_USD_PER_MTOK
        value: "3"
      - key: MODEL_PRICE_OUTPUT_USD_PER_MTOK
        value: "15"
      - key: WOS_INBOX_SYNC_SECONDS
        value: "300"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: WOS_SECRETS_KEY
        generateValue: true

services:
  - type: web
    name: scout-os-web
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: "off"
    healthCheckPath: /api/healthz
    buildCommand: corepack enable && corepack prepare pnpm@10.28.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @wos/web build
    startCommand: pnpm --filter @wos/web start
    envVars:
      - fromGroup: scout-os-shared
      - key: DATABASE_URL
        fromDatabase:
          name: scout-os-db
          property: connectionString
      - key: DATABASE_URL_ADMIN
        sync: false
      - key: BETTER_AUTH_URL
        fromService:
          name: scout-os-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: worker
    name: scout-os-worker
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: "off"
    buildCommand: corepack enable && corepack prepare pnpm@10.28.0 --activate && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @wos/web worker
    envVars:
      - fromGroup: scout-os-shared
      - key: DATABASE_URL
        fromDatabase:
          name: scout-os-db
          property: connectionString
      - key: DATABASE_URL_ADMIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
